name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Build and inventory native installers on this runner OS
        type: boolean
        default: false

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go test ./...
      - run: go vet ./...

  downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/prepare-downloads.test.cjs
      - run: node scripts/smoke-native.test.cjs

  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Disable identity auto-discovery unless a cert secret is present
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ] && [ -z "$APPLE_ID" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing secrets configured; installer will stay an unsigned release blocker."
          else
            echo "Signing secrets detected (values are never printed)."
          fi
      - run: npm ci
      - run: npm run frontend:install
      - name: Package current OS
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) npm run package:windows ;;
            macOS) npm run package:macos ;;
            Linux) npm run package:linux ;;
            *) echo "Unsupported runner: $RUNNER_OS" && exit 1 ;;
          esac
      - run: npm run smoke:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/release-manifest.json
            dist/sbom.cyclonedx.json
            dist/downloads.html
            dist/native-smoke-report.json
          if-no-files-found: warn
