name: Native installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-smoke:
    name: ${{ matrix.name }} installer
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            package_script: package:windows
          # La plataforma Linux objetivo es Linux Mint 22.3 "Zena", que esta
          # construida sobre Ubuntu 24.04.3 LTS. Se fija el runner a 24.04 en
          # vez de ubuntu-latest para que el AppImage se compile contra la
          # misma linea base de glibc y librerias del sistema que el objetivo,
          # y para que un salto futuro de ubuntu-latest no lo desalinee.
          # GitHub no ofrece runners de Mint; 24.04 es la base de Mint 22.3.
          - name: Linux
            runner: ubuntu-24.04
            package_script: package:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Package native installer
        run: npm run ${{ matrix.package_script }}

      - name: Smoke packaged application (Windows)
        if: runner.os == 'Windows'
        run: npm run test:smoke:packaged

      # Electron necesita un servidor X aunque no abra BrowserWindow:
      # el runner Linux es headless, asi que el smoke corre bajo Xvfb.
      - name: Smoke packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke:packaged

      - name: Verify Windows Authenticode
        if: runner.os == 'Windows' && env.CSC_LINK != ''
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'No se encontró el instalador NSIS.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Firma inválida: $($signature.Status)" }

      # always(): si el smoke falla queremos igual el instalador para poder
      # reproducir el fallo en una maquina real.
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zajuna-${{ matrix.name }}-native
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/release-manifest.json
            dist/sbom.cyclonedx.json
