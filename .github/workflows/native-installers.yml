name: Native installers

# Manual only. Automatic packaging on tags lives in packaging.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-smoke:
    name: ${{ matrix.name }} installer
    runs-on: ${{ matrix.runner }}
    env:
      HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            package_script: package:windows
          - name: Linux
            runner: ubuntu-latest
            package_script: package:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
      - name: Install dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Package native installer
        run: npm run ${{ matrix.package_script }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Smoke packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- npm run test:smoke:packaged
      - name: Smoke packaged application (Windows)
        if: runner.os == 'Windows'
        run: npm run test:smoke:packaged
      - name: Verify Windows Authenticode
        if: runner.os == 'Windows' && env.HAS_CSC_LINK == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'No se encontró el instalador NSIS.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Firma inválida: $($signature.Status)" }
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: zajuna-${{ matrix.name }}-native
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/release-manifest.json
            dist/sbom.cyclonedx.json
